aid: hydrosat
name: Hydrosat
description: >-
  Hydrosat delivers thermal infrared satellite data and analytics for
  monitoring resources and detecting change, combining thermal-infrared imaging,
  proprietary algorithms, and field-tested expertise to support food security,
  water security, and industrial monitoring across 60+ countries. Its Discovery
  platform exposes a STAC-compliant (SpatioTemporal Asset Catalog) API at
  stac.hydrosat.com serving VZ-1 (Van Zyl-01) thermal and VNIR imagery at
  processing levels L1A, L1B, and L2, accessible via the Discovery Portal web
  app, direct download, or the OAuth2-protected STAC API. Products include the
  IrriWatch irrigation-planning tool and water/crop management solutions.
