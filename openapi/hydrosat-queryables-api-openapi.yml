openapi: 3.1.0
info:
  title: Hydrosat STAC Catalog Queryables API
  version: '0.1'
tags:
- name: Queryables
paths:
  /queryables:
    get:
      tags:
      - Queryables
      summary: Queryables
      description: Endpoint.
      operationId: Queryables_queryables_get
      responses:
        '200':
          description: Successful Response
          content:
            application/schema+json:
              schema: {}
  /collections/{collection_id}/queryables:
    get:
      tags:
      - Queryables
      summary: Collection Queryables
      description: Endpoint.
      operationId: Collection_Queryables_collections__collection_id__queryables_get
      parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: string
          description: Collection ID
          title: Collection Id
        description: Collection ID
      responses:
        '200':
          description: Successful Response
          content:
            application/schema+json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
